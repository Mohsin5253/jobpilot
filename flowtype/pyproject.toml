[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtype"
version = "0.1.0"
description = "System-wide push-to-talk dictation: hold a key, speak, release, and the text appears at your cursor."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "httpx>=0.27",
    "keyring>=25",
    # Silero VAD (ONNX, no torch) ships inside faster-whisper, which is also the planned local ASR fallback.
    "faster-whisper>=1.0.3",
    # Clipboard and focused-field access on each OS.
    "comtypes>=1.4; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyperclip>=1.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flowtype = "flowtype.__main__:main"

[tool.setuptools.packages.find]
include = ["flowtype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
