name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: jobpilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobpilot_test
      CAMPUS_PARTITIONS: "4"  # fewer partitions in the test database (production keeps 32)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint (pyflakes + syntax)
        run: uv run ruff check app scripts tests evals --select F,E9
      - name: Migrations apply cleanly from scratch
        run: DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head
      - run: uv run pytest -q
      - name: Offline evals (matcher + guard)
        run: EMBEDDING_BACKEND=hash uv run python -m evals.run_evals
      - name: Eval gate (thresholds + no regression vs baseline; report in the run summary)
        run: EMBEDDING_BACKEND=hash uv run python -m evals.gate

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Extension tests
        run: node --test ../extension/test/*.test.js
      - name: Dictation unit tests
        run: npm run test:unit
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API / worker image
        uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: frontend, push: false, build-args: API_URL=http://api:8000, cache-from: type=gha, cache-to: "type=gha,mode=max" }
